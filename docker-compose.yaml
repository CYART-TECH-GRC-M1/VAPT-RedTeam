services:
  postgres:
    image: postgres:16
    container_name: cygrc-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: cygrc
      POSTGRES_PASSWORD: cygrc
      POSTGRES_DB: cygrc

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: